[package]
name = "hush"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chacha20poly1305 = { version = "0.11.0", features = ["zeroize"] }
thiserror = "2.0.21"
argon2 = { version = "0.6.0", features = ["zeroize"] }
zeroize = { version = "1.9.1", features = ["derive"] }
base64ct = { version = "1.8.3", features = ["alloc"] }
getrandom = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Key derivation is deliberately heavy; unoptimized it takes over a second per unlock in `tauri dev`.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# System notifications that lock the vault: sleep and screen lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSString",
] }

[dev-dependencies]
tempfile = "3.27.0"
