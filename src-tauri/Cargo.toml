[package]
name = "hush"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "hush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hush-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.21"
zeroize = "1.9.1"
base64ct = { version = "1.8.3", features = ["alloc"] }
# Taps felt while pinching the text sample; a no-op on the desktop.
tauri-plugin-haptics = "2.4.2"

# System notifications that lock the vault: sleep and screen lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSDictionary",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSString",
] }

# The webview, fitted to the screen and kept above the keyboard; the phone's
# shake; the playlist played in the Music app.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSDictionary",
  "NSNotification",
  "NSOperation",
  "NSString",
  "NSValue",
] }
objc2-core-motion = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "CMAccelerometer",
  "CMDeviceMotion",
  "CMLogItem",
  "CMMotionManager",
] }
objc2-ui-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "UIApplication",
  "UIGeometry",
  "UIImage",
  "UIResponder",
  "UIView",
  "UIWindow",
] }
objc2-media-player = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-foundation",
  "MPMediaEntity",
  "MPMediaItem",
  "MPMediaItemCollection",
  "MPMediaLibrary",
  "MPMediaPlayback",
  "MPMediaPlaylist",
  "MPMediaQuery",
  "MPMusicPlayerController",
] }
block2 = "0.6.2"

[dev-dependencies]
serde_json = "1"
