name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The type-aware lint reads worker/tsconfig.json, which needs the worker's types.
      - run: pnpm install --frozen-lockfile --ignore-workspace --dir worker
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm typecheck
      - run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # System libraries Tauri needs to compile on Linux.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: apple/scripts/lint.sh
      - run: apple/scripts/build-core.sh
      - run: swift test --package-path apple/Packages/Modules
      # The app bundles the editor's web pages.
      - run: apple/scripts/build-web.sh
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: apple
      - name: Build for macOS, the iOS simulator, and iOS devices
        working-directory: apple
        run: |
          for destination in "generic/platform=macOS" "generic/platform=iOS Simulator" "generic/platform=iOS"; do
            xcodebuild -project Hush.xcodeproj -scheme Hush -destination "$destination" \
              build CODE_SIGNING_ALLOWED=NO -quiet
          done
