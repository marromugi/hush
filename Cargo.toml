[workspace]
members = ["core", "src-tauri"]
resolver = "3"

# Cargo reads profiles only from the workspace root.

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Key derivation is deliberately heavy; unoptimized it takes over a second per unlock in `tauri dev`.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
