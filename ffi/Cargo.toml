[package]
name = "hush-ffi"
version = "0.1.0"
description = "The diary's core, callable from Swift"
edition = "2024"

[lib]
name = "hush_ffi"
# Goes into the XCFramework.
crate-type = ["staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# Only the bindings generator needs it; the library stays without it.
cli = ["uniffi/cli"]

[dependencies]
hush-core = { path = "../core" }
# `tokio` runs the core's link fetching, which needs a Tokio runtime, for Swift's `await`.
uniffi = { version = "0.32.2", features = ["tokio"] }
zeroize = "1.9.1"
